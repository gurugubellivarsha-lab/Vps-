name: Windows RDP Backup and Restore

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose backup or restore"
        required: true
        type: choice
        options:
          - backup
          - restore

permissions:
  contents: write

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: rdp-backups
          persist-credentials: true

      - name: Prepare backup folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backup | Out-Null

      - name: Restore saved backup
        if: inputs.mode == 'restore'
        shell: pwsh
        run: |
          $file = Get-ChildItem backup -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -eq ".zip" } |
            Select-Object -First 1

          if (-not $file) {
            throw "No ZIP backup exists on the rdp-backups branch."
          }

          Expand-Archive -Path $file.FullName `
            -DestinationPath "$env:RUNNER_TEMP\rdp-restore" -Force

          Write-Host "Backup extracted successfully."
          Write-Host "Files are in $env:RUNNER_TEMP\rdp-restore"

      - name: Check backup before upload
        if: inputs.mode == 'backup'
        shell: pwsh
        run: |
          $file = Get-ChildItem backup -Filter "*.zip" -File |
            Select-Object -First 1

          if (-not $file) {
            throw "Put your existing RDP backup ZIP in the backup folder first."
          }

          if ($file.Length -eq 0) {
            throw "Backup ZIP is empty."
          }

      - name: Save backup to repository
        if: inputs.mode == 'backup'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/
          git commit -m "Save RDP backup" || {
            Write-Host "No changes to save."
          }
          git push origin HEAD:rdp-backups
