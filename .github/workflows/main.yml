
name: NRB RDP - Backup and Restore

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nrb-rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v5
        with:
          ref: rdp-backups
          persist-credentials: false

      - name: Validate secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing RDP_PASSWORD repository secret."
          }

          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw "RDP_PASSWORD must be at least 14 characters."
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TS_AUTHKEY repository secret."
          }

      - name: Restore committed ZIP backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = Join-Path $env:GITHUB_WORKSPACE "RDP-Workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "backup\windows-user-files.zip"

          if (Test-Path $zipPath) {
            Expand-Archive -LiteralPath $zipPath `
              -DestinationPath $workspace -Force
            Write-Host "Committed ZIP backup restored."
          } else {
            Write-Host "No committed ZIP backup found."
          }

      - name: Restore previous workflow artifact
        uses: dawidd6/action-download-artifact@v11
        continue-on-error: true
        with:
          workflow: rdp.yml
          branch: rdp-backups
          name: RDP-Workspace
          path: RDP-Workspace
          if_no_artifact_found: warn

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" `
              -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "rdpuser" -Password $password
          } else {
            New-LocalUser -Name "rdpuser" `
              -Password $password `
              -Description "Temporary NRB RDP account" `
              -PasswordNeverExpires | Out-Null
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          timeout: 3m

      - name: Show connection details
        shell: pwsh
        run: |
          Write-Host "Tailscale IPv4:"
          tailscale ip -4
          Write-Host "RDP username: rdpuser"
          Write-Host "RDP port: 3389"

      - name: Install Minecraft Launcher
        shell: pwsh
        continue-on-error: true
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install --id Mojang.MinecraftLauncher `
              --exact --silent `
              --accept-source-agreements `
              --accept-package-agreements
          } else {
            Write-Warning "winget unavailable; skipping installation."
          }

      - name: Keep session available
        shell: pwsh
        run: |
          for ($i = 1; $i -le 340; $i++) {
            Start-Sleep -Seconds 60

            if ($i % 5 -eq 0) {
              Write-Host "Session active: $i minutes."
            }
          }

      - name: Prepare workspace backup
        if: always()
        shell: pwsh
        run: |
          $workspace = Join-Path $env:GITHUB_WORKSPACE "RDP-Workspace"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null

          "Backup time: $(Get-Date -Format o)" |
            Set-Content (Join-Path $workspace "backup-info.txt") -Encoding UTF8

      - name: Upload workspace backup
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: RDP-Workspace
          path: RDP-Workspace/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
          
