
name: Windows RDP + Tailscale + Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA1!"

          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "rdpuser" -Password $secure
          } else {
            New-LocalUser -Name "rdpuser" -Password $secure
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          "RDP_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append
          "RDP_USERNAME=rdpuser" | Out-File $env:GITHUB_ENV -Append

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Minecraft Paper
        shell: pwsh
        run: |
          $dir = "C:\minecraft"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $project = Invoke-RestMethod "https://api.papermc.io/v2/projects/paper"
          $version = $project.versions[-1]

          $info = Invoke-RestMethod "https://api.papermc.io/v2/projects/paper/versions/$version"
          $build = $info.builds[-1]

          $url = "https://api.papermc.io/v2/projects/paper/versions/$version/builds/$build/downloads/paper-$version-$build.jar"

          Invoke-WebRequest $url -OutFile "$dir\server.jar"
          Set-Content "$dir\eula.txt" "eula=true"

          New-NetFirewallRule `
            -DisplayName "Minecraft Private Server" `
            -Direction Inbound -Protocol TCP `
            -LocalPort 25565 -Action Allow `
            -Profile Private -ErrorAction SilentlyContinue

          Start-Process java `
            -ArgumentList "-Xms1G -Xmx3G -jar server.jar --nogui" `
            -WorkingDirectory $dir

      - name: Show Connection Details
        shell: pwsh
        run: |
          $ip = tailscale ip -4

          Write-Host "================================"
          Write-Host "RDP IP: $ip"
          Write-Host "RDP PORT: 3389"
          Write-Host "USERNAME: $env:RDP_USERNAME"
          Write-Host "PASSWORD: $env:RDP_PASSWORD"
          Write-Host "MINECRAFT SERVER: ${ip}:25565"
          Write-Host "================================"

          while ($true) {
            Start-Sleep -Seconds 30
          }
          
