name: Windows RDP + Tailscale + Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    # Windows 11 ARM runner is available as a preview.
    runs-on: windows-11-arm
    timeout-minutes: 350

    steps:
      - name: Enable RDP and Create User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in GitHub Secrets."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "rdpuser" `
              -Password $password `
              -PasswordNeverExpires
          } else {
            Set-LocalUser -Name "rdpuser" -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $dir = "C:\minecraft"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir

          $project = Invoke-RestMethod `
            "https://api.papermc.io/v2/projects/paper"

          $version = $project.versions[-1]

          $buildInfo = Invoke-RestMethod `
            "https://api.papermc.io/v2/projects/paper/versions/$version"

          $build = $buildInfo.builds[-1]

          $url = "https://api.papermc.io/v2/projects/paper/versions/$version/builds/$build/downloads/paper-$version-$build.jar"

          Invoke-WebRequest -Uri $url -OutFile "server.jar"

          "eula=true" | Set-Content "eula.txt"

          Start-Process -FilePath "java" `
            -ArgumentList "-Xms1G -Xmx3G -jar server.jar --nogui" `
            -WorkingDirectory $dir

      - name: Show Private Connection Details
        shell: pwsh
        run: |
          $ip = tailscale ip -4
          Write-Host "Tailscale IP: $ip"
          Write-Host "RDP address: ${ip}:3389"
          Write-Host "RDP username: rdpuser"
          Write-Host "Minecraft server port: 25565"
          Write-Host "Keep the workflow running."
          while ($true) {
            Start-Sleep -Seconds 30
          }
          
