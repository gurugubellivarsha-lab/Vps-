
name: Create Real Ubuntu VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-vps:
    runs-on: ubuntu-24.04

    steps:
      - name: Create Ubuntu VPS
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          SSH_KEY_ID: ${{ secrets.DO_SSH_KEY_ID }}
        run: |
          set -euo pipefail

          if [ -z "$DO_TOKEN" ] || [ -z "$SSH_KEY_ID" ]; then
            echo "Configure DO_TOKEN and DO_SSH_KEY_ID in GitHub Secrets."
            exit 1
          fi

          RESPONSE=$(curl -fsS -X POST \
            "https://api.digitalocean.com/v2/droplets" \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"nrb-ubuntu-vps\",
              \"region\": \"blr1\",
              \"size\": \"s-1vcpu-1gb\",
              \"image\": \"ubuntu-24-04-x64\",
              \"ssh_keys\": [\"$SSH_KEY_ID\"],
              \"ipv6\": true,
              \"monitoring\": true
            }")

          echo "$RESPONSE" | jq .

          DROPLET_ID=$(echo "$RESPONSE" | jq -r '.droplet.id // empty')

          if [ -z "$DROPLET_ID" ]; then
            echo "VPS creation failed."
            exit 1
          fi

          echo "VPS created. ID: $DROPLET_ID"
          echo "Check the DigitalOcean dashboard for its public IPv4 address."
          
