name: Ubuntu Docker VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io curl
          sudo systemctl start docker
          sudo docker version

      - name: Create Ubuntu container
        run: |
          sudo docker run -d \
            --name ubuntu-vps \
            ubuntu:24.04 \
            sleep infinity

      - name: Create user and password
        shell: bash
        run: |
          set -e

          USERNAME="vpsuser"
          PASSWORD="$(openssl rand -hex 16)"

          sudo docker exec ubuntu-vps bash -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y sudo
            useradd -m -s /bin/bash vpsuser
          '

          printf '%s:%s\n' "$USERNAME" "$PASSWORD" |
            sudo docker exec -i ubuntu-vps chpasswd

          echo "::add-mask::$PASSWORD"
          echo "Username: $USERNAME"
          echo "Password: $PASSWORD"

      - name: Display IPv4
        run: |
          echo "Runner public IPv4:"
          curl -4 -fsS https://api.ipify.org || true
          echo
          echo "Container IPv4:"
          sudo docker inspect \
            -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            ubuntu-vps

      - name: Verify container
        run: |
          sudo docker ps
          sudo docker exec ubuntu-vps id vpsuser
          sudo docker exec ubuntu-vps cat /etc/os-release
          
