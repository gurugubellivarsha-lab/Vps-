
name: Ubuntu Browser Terminal with Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show Tailscale connection
        run: |
          tailscale status
          tailscale ip -4

      - name: Create Ubuntu container
        run: |
          docker run -d \
            --name ubuntu-vps \
            ubuntu:24.04 sleep infinity

          docker exec ubuntu-vps bash -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              bash sudo curl ca-certificates
            useradd -m -s /bin/bash NRB
            usermod -aG sudo NRB
          '

      - name: Keep workflow alive
        run: |
          echo "Ubuntu container is running."
          echo "Tailscale is connected to the GitHub runner."
          echo "This temporary environment stops when the job ends."
          sleep 21600
          
