
name: Ubuntu Docker VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Create Ubuntu container
        run: |
          docker pull ubuntu:24.04
          docker run -d \
            --name ubuntu-vps \
            --hostname ubuntu-vps \
            ubuntu:24.04 sleep infinity

      - name: Create user and password
        shell: bash
        run: |
          set -e

          USERNAME="NRB"
          PASSWORD="ROOT"

          docker exec ubuntu-vps bash -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y sudo
            useradd -m -s /bin/bash NRB
          '

          printf '%s:%s\n' "$USERNAME" "$PASSWORD" |
            docker exec -i ubuntu-vps chpasswd

          echo "Username: NRB"
          echo "Password: ROOT"

      - name: Show IPv4
        run: |
          echo "Public runner IPv4:"
          curl -4 -fsS https://api.ipify.org || true
          echo

          echo "Container IPv4:"
          docker inspect -f \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            ubuntu-vps

      - name: Verify Ubuntu
        run: |
          docker exec ubuntu-vps id NRB
          docker exec ubuntu-vps cat /etc/os-release
          docker ps
          
