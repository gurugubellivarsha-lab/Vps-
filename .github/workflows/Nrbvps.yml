name: Create Ubuntu VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-vps:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Validate API token
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DO_TOKEN" || {
            echo "::error::Add DO_TOKEN in GitHub Secrets"
            exit 1
          }

          CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $DO_TOKEN" \
            https://api.digitalocean.com/v2/account)

          if [ "$CODE" != "200" ]; then
            echo "::error::Token invalid or missing account permissions (HTTP $CODE)"
            cat response.json
            exit 1
          fi

          echo "API token verified."

      - name: Find six-CPU plan
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsS \
            -H "Authorization: Bearer $DO_TOKEN" \
            "https://api.digitalocean.com/v2/sizes?per_page=200" \
            -o sizes.json

          SIZE=$(jq -r '
            [.sizes[]
              | select(.available == true)
              | select(.vcpus == 6)
              | select(.slug | startswith("s-") or startswith("c-"))
            ][0].slug // empty
          ' sizes.json)

          if [ -z "$SIZE" ]; then
            echo "::error::No available six-vCPU plan found. Check your provider's available sizes."
            jq -r '.sizes[] | select(.available == true) |
              "\(.slug) \(.vcpus) vCPU"' sizes.json | head -30
            exit 1
          fi

          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "Selected plan: $SIZE"

      - name: Create VPS
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          SSH_KEY_ID: ${{ secrets.DO_SSH_KEY_ID }}
          SIZE: ${{ env.SIZE }}
        run: |
          set -euo pipefail

          test -n "$SSH_KEY_ID" || {
            echo "::error::Add DO_SSH_KEY_ID in GitHub Secrets"
            exit 1
          }

          curl -fsS \
            -H "Authorization: Bearer $DO_TOKEN" \
            https://api.digitalocean.com/v2/account/keys \
            -o keys.json

          jq -e --arg id "$SSH_KEY_ID" \
            '.ssh_keys[] | select((.id|tostring)==$id)' \
            keys.json >/dev/null || {
              echo "::error::SSH key ID not found in this account"
              exit 1
            }

          jq -n \
            --arg name "nrb-ubuntu-vps" \
            --arg region "blr1" \
            --arg size "$SIZE" \
            --arg image "ubuntu-24-04-x64" \
            --arg key "$SSH_KEY_ID" \
            '{
              name: $name,
              region: $region,
              size: $size,
              image: $image,
              ssh_keys: [$key],
              ipv6: true,
              monitoring: true
            }' > payload.json

          CODE=$(curl -sS -o result.json -w '%{http_code}' \
            -X POST https://api.digitalocean.com/v2/droplets \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json)

          if [ "$CODE" != "202" ]; then
            echo "::error::Creation failed (HTTP $CODE)"
            cat result.json
            exit 1
          fi

          ID=$(jq -r '.droplet.id' result.json)
          echo "VPS_ID=$ID" >> "$GITHUB_ENV"
          echo "VPS created: $ID"

      - name: Get public IPv4
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          VPS_ID: ${{ env.VPS_ID }}
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            curl -fsS \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/$VPS_ID" \
              -o droplet.json || true

            IP=$(jq -r '
              .droplet.networks.v4[]?
              | select(.type == "public")
              | .ip_address
            ' droplet.json 2>/dev/null | head -1)

            if [ -n "${IP:-}" ]; then
              echo "Public IPv4: $IP"
              exit 0
            fi

            sleep 10
          done

          echo "::error::VPS created, but IPv4 is not ready. Check the DigitalOcean dashboard."
          exit 1
          
