
name: Create Ubuntu VPS - 6 CPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-vps:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Validate DigitalOcean token
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DO_TOKEN:-}" ]; then
            echo "::error::DO_TOKEN secret is missing."
            exit 1
          fi

          CODE=$(curl -sS -o /tmp/account.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $DO_TOKEN" \
            https://api.digitalocean.com/v2/account)

          if [ "$CODE" != "200" ]; then
            echo "::error::Token validation failed (HTTP $CODE)."
            cat /tmp/account.json
            exit 1
          fi

          echo "DigitalOcean token is valid."

      - name: Create six-vCPU Ubuntu server
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          SSH_KEY_ID: ${{ secrets.DO_SSH_KEY_ID }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY_ID:-}" ]; then
            echo "::error::Add DO_SSH_KEY_ID to repository secrets."
            exit 1
          fi

          CODE=$(curl -sS -o /tmp/keys.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $DO_TOKEN" \
            https://api.digitalocean.com/v2/account/keys)

          if [ "$CODE" != "200" ]; then
            echo "::error::Cannot list SSH keys (HTTP $CODE). Check token permissions."
            cat /tmp/keys.json
            exit 1
          fi

          if ! jq -e --arg id "$SSH_KEY_ID" \
            '.ssh_keys[] | select((.id|tostring)==$id)' \
            /tmp/keys.json >/dev/null; then
            echo "::error::DO_SSH_KEY_ID does not match a key in your account."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg key "$SSH_KEY_ID" \
            '{
              name: "nrb-ubuntu-vps",
              region: "blr1",
              size: "c-8",
              image: "ubuntu-24-04-x64",
              ssh_keys: [$key],
              ipv6: true,
              monitoring: true
            }')

          CODE=$(curl -sS -o /tmp/create.json \
            -w '%{http_code}' \
            -X POST https://api.digitalocean.com/v2/droplets \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$CODE" != "202" ]; then
            echo "::error::VPS creation failed (HTTP $CODE)."
            cat /tmp/create.json
            exit 1
          fi

          ID=$(jq -r '.droplet.id' /tmp/create.json)
          echo "VPS creation accepted. Droplet ID: $ID"

          echo "Waiting for server IP..."
          for i in $(seq 1 30); do
            sleep 10
            curl -fsS \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/droplets/$ID" \
              -o /tmp/droplet.json || continue

            IP=$(jq -r \
              '.droplet.networks.v4[]? |
               select(.type=="public") | .ip_address' \
              /tmp/droplet.json | head -n 1)

            if [ -n "$IP" ]; then
              echo "Public IPv4: $IP"
              echo "VPS ID: $ID"
              exit 0
            fi
          done

          echo "::error::Server was created, but its public IPv4 is not ready yet."
          echo "Check the Droplet in your DigitalOcean dashboard."
          exit 1
          
